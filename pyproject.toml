[project]
name = "llm-observability-platform"
version = "0.1.0"
description = "Monitoring built for LLM applications: cost per feature, latency percentiles, grounding, prompt drift, alerting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# No numpy: PSI is a handful of logarithms, and pulling in a numerics stack for
# that would be the tail wagging the dog.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
ui  = ["streamlit>=1.40", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmobs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
